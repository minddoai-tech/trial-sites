<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Striker Soccer</title>
  <style>
    :root { --ink:#2b1836; --cream:#fff7dc; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:"Trebuchet MS",system-ui,sans-serif; color:var(--ink); background:radial-gradient(circle at 20% 10%,#fff4ac 0 12%,transparent 32%),linear-gradient(145deg,#f58d76,#6a5fe9 85%); }
    .shell { width:min(1000px,96vw); padding:18px; }
    .topbar { display:flex; justify-content:space-between; align-items:center; gap:14px; margin-bottom:12px; }
    h1 { margin:0; font-size:clamp(1.35rem,3vw,2rem); letter-spacing:.03em; text-shadow:2px 3px 0 #fff; }
    .badge { background:var(--cream); border:3px solid var(--ink); border-radius:999px; padding:7px 12px; font-weight:900; box-shadow:4px 4px 0 var(--ink); white-space:nowrap; }
    .game-card { background:#1e1730; border:4px solid var(--ink); border-radius:18px; padding:10px; box-shadow:8px 9px 0 rgba(43,24,54,.45); }
    canvas { display:block; width:100%; height:auto; border-radius:10px; background:#71be66; }
    .controls { display:flex; flex-wrap:wrap; justify-content:space-between; gap:10px; margin-top:14px; align-items:center; }
    .help { color:#fff; font-weight:800; line-height:1.4; }
    kbd { display:inline-block; padding:3px 7px; border:2px solid var(--ink); border-bottom-width:4px; border-radius:6px; background:#fff7dc; color:var(--ink); font-weight:900; }
    button { cursor:pointer; border:3px solid var(--ink); border-radius:10px; padding:10px 16px; background:#ffd447; color:var(--ink); font:inherit; font-weight:900; box-shadow:3px 4px 0 var(--ink); }
    button:active { transform:translate(2px,2px); box-shadow:1px 2px 0 var(--ink); }
    .tip { margin:12px 0 0; color:#fff; text-align:center; font-size:.9rem; font-weight:700; opacity:.9; }
  </style>
</head>
<body>
  <main class="shell">
    <div class="topbar"><h1>🍄 Super Striker Soccer</h1><div class="badge">First to 3 wins!</div></div>
    <section class="game-card"><canvas id="game" width="960" height="560" aria-label="A playable soccer game"></canvas></section>
    <div class="controls"><div class="help"><kbd>WASD</kbd> / <kbd>←↑↓→</kbd> move &nbsp; <kbd>SPACE</kbd> kick &nbsp; <kbd>SHIFT</kbd> super kick</div><button id="restart">Restart match</button></div>
    <p class="tip">You can roam anywhere! Protect the goal or join the action with Space and Shift.</p>
  </main>
  <script>
    const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height,keys={};
    addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'){keys.space=true;e.preventDefault();}});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.code==='Space')keys.space=false;});document.getElementById('restart').onclick=reset;
    const field={x:48,y:62,w:864,h:436,goalH:146};let player,rival,teammates,opponents,ball,score,message,messageTimer,gameOver,last=0;
    function reset(){player={x:220,y:H/2,vx:0,vy:0,r:22,kick:0};rival={x:740,y:H/2,vx:0,vy:0,r:22,kick:0};teammates=[{x:300,y:180,vx:0,vy:0,r:20,kick:0},{x:300,y:380,vx:0,vy:0,r:20,kick:0},{x:400,y:125,vx:0,vy:0,r:19,kick:0},{x:400,y:435,vx:0,vy:0,r:19,kick:0}];opponents=[{x:660,y:180,vx:0,vy:0,r:20,kick:0},{x:660,y:380,vx:0,vy:0,r:20,kick:0},{x:560,y:125,vx:0,vy:0,r:19,kick:0},{x:560,y:435,vx:0,vy:0,r:19,kick:0}];ball={x:W/2,y:H/2,vx:0,vy:0,r:12,fire:0};score=[0,0];message='KICK OFF!';messageTimer=100;gameOver=false;} reset();
    const clamp=(n,a,b)=>Math.max(a,Math.min(b,n)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
    function say(t){message=t;messageTimer=72;} function scoreGoal(team){score[team]++;if(score[team]>=3){gameOver=true;say(team===0?'YOU WIN! 🏆':'RED KOOPA WINS!');}else{say(team===0?'GOOOAL!':'THE KOOPA STRIKES!');resetPositions();}}
    function resetPositions(){player.x=220;player.y=H/2;rival.x=740;rival.y=H/2;[[300,180],[300,380],[400,125],[400,435]].forEach((p,i)=>{teammates[i].x=p[0];teammates[i].y=p[1];});[[660,180],[660,380],[560,125],[560,435]].forEach((p,i)=>{opponents[i].x=p[0];opponents[i].y=p[1];});for(const a of [player,rival,...teammates,...opponents])a.vx=a.vy=a.kick=0;ball.x=W/2;ball.y=H/2;ball.vx=ball.vy=0;ball.fire=0;}
    function moveActor(a,dx,dy,speed){const m=Math.hypot(dx,dy)||1;a.vx=dx/m*speed;a.vy=dy/m*speed;a.x=clamp(a.x+a.vx,field.x+28,field.x+field.w-28);a.y=clamp(a.y+a.vy,field.y+28,field.y+field.h-28);}
    function kick(a,team,superKick=false){const range=superKick?100:72;if(a.kick>0||dist(a,ball)>range)return;let dx=ball.x-a.x,dy=ball.y-a.y,m=Math.hypot(dx,dy)||1,power=superKick?18:10;ball.vx=team===0?Math.abs(dx/m*power)+(superKick?6:3):-Math.abs(dx/m*power+3);ball.vy=dy/m*power;ball.fire=superKick?42:0;a.kick=superKick?70:12;say(superKick?'SUPER KICK!':team===0?'POW!':'BONK!');}
    function update(){if(gameOver)return;let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);moveActor(player,dx,dy,4.1);if(keys.shift)kick(player,0,true);else if(keys.space)kick(player,0);player.kick=Math.max(0,player.kick-1);let cx=ball.x>600?ball.x:Math.max(600,ball.x);moveActor(rival,cx-rival.x,ball.y-rival.y,1.75);if(dist(rival,ball)<42)kick(rival,1);rival.kick=Math.max(0,rival.kick-1);for(const mate of teammates){moveActor(mate,ball.x-mate.x,ball.y-mate.y,2.05);if(dist(mate,ball)<42)kick(mate,0);mate.kick=Math.max(0,mate.kick-1);}for(const foe of opponents){moveActor(foe,ball.x-foe.x,ball.y-foe.y,1.65);if(dist(foe,ball)<38)kick(foe,1);foe.kick=Math.max(0,foe.kick-1);}for(const [a,team] of [[player,0],[rival,1],...teammates.map(a=>[a,0]),...opponents.map(a=>[a,1])]){const d=dist(a,ball),min=a.r+ball.r;if(d<min){let nx=(ball.x-a.x)/(d||1),ny=(ball.y-a.y)/(d||1);ball.x=a.x+nx*min;ball.y=a.y+ny*min;ball.vx+=a.vx*.45+(team===0?.12:-.12);ball.vy+=a.vy*.45;}}ball.x+=ball.vx;ball.y+=ball.vy;ball.vx*=.975;ball.vy*=.975;ball.fire=Math.max(0,ball.fire-1);if(ball.y<field.y+ball.r){ball.y=field.y+ball.r;ball.vy=Math.abs(ball.vy)*.85;}if(ball.y>field.y+field.h-ball.r){ball.y=field.y+field.h-ball.r;ball.vy=-Math.abs(ball.vy)*.85;}let top=H/2-field.goalH/2,bot=H/2+field.goalH/2;if(ball.x<field.x-ball.r&&ball.y>top&&ball.y<bot)scoreGoal(1);else if(ball.x>field.x+field.w+ball.r&&ball.y>top&&ball.y<bot)scoreGoal(0);if(ball.x<field.x+ball.r&&!(ball.y>top&&ball.y<bot)){ball.x=field.x+ball.r;ball.vx=Math.abs(ball.vx)*.85;}if(ball.x>field.x+field.w-ball.r&&!(ball.y>top&&ball.y<bot)){ball.x=field.x+field.w-ball.r;ball.vx=-Math.abs(ball.vx)*.85;}if(messageTimer>0)messageTimer--;}
    function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}
    function drawField(){ctx.fillStyle='#65b85e';ctx.fillRect(0,0,W,H);ctx.fillStyle='#75c568';for(let x=field.x;x<field.x+field.w;x+=72)ctx.fillRect(x,field.y,36,field.h);ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=4;ctx.strokeRect(field.x,field.y,field.w,field.h);ctx.beginPath();ctx.moveTo(W/2,field.y);ctx.lineTo(W/2,field.y+field.h);ctx.stroke();ctx.beginPath();ctx.arc(W/2,H/2,72,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(W/2,H/2,5,0,Math.PI*2);ctx.fill();let top=H/2-field.goalH/2;ctx.fillStyle='#efe8c6';ctx.fillRect(field.x-17,top,17,field.goalH);ctx.fillRect(field.x+field.w,top,17,field.goalH);ctx.strokeStyle='#e8ddad';ctx.lineWidth=2;ctx.strokeRect(field.x-29,top,29,field.goalH);ctx.strokeRect(field.x+field.w,top,29,field.goalH);ctx.fillStyle='#fff7dc';ctx.strokeStyle='#2b1836';ctx.lineWidth=4;rr(W/2-112,12,224,38,19);ctx.fillStyle='#e7473f';ctx.font='900 22px Trebuchet MS';ctx.textAlign='center';ctx.fillText(`${score[0]}   —   ${score[1]}`,W/2,39);ctx.fillStyle='#2b1836';ctx.font='900 12px Trebuchet MS';ctx.fillText('YOU',W/2-68,37);ctx.fillText('KOOPA',W/2+68,37);}
    function drawPlayer(a,red,label){ctx.save();ctx.translate(a.x,a.y);ctx.fillStyle='rgba(43,24,54,.22)';ctx.beginPath();ctx.ellipse(0,24,24,8,0,0,Math.PI*2);ctx.fill();if(label==='MARIO'){ctx.fillStyle='#2b1836';ctx.beginPath();ctx.arc(-15,16,7,0,Math.PI*2);ctx.arc(15,16,7,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e7473f';ctx.beginPath();ctx.roundRect(-28,0,56,22,8);ctx.fill();ctx.fillStyle='#ffd447';ctx.beginPath();ctx.roundRect(-18,-8,36,14,6);ctx.fill();ctx.fillStyle='#b9322f';ctx.fillRect(-28,8,56,5);}ctx.fillStyle=red?'#e7473f':'#3b7ee8';ctx.beginPath();ctx.arc(0,0,22,0,Math.PI*2);ctx.fill();ctx.fillStyle=red?'#b9322f':'#255cb4';ctx.beginPath();ctx.arc(0,-10,18,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='#ffe0b2';ctx.beginPath();ctx.arc(0,-2,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#2b1836';ctx.beginPath();ctx.arc(-4,-4,2,0,Math.PI*2);ctx.arc(4,-4,2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff7dc';ctx.font='900 11px Trebuchet MS';ctx.textAlign='center';ctx.fillText(label,0,42);ctx.restore();}
    function drawBall(){ctx.save();ctx.translate(ball.x,ball.y);if(ball.fire>0){ctx.fillStyle='rgba(255,92,25,.35)';ctx.beginPath();ctx.arc(0,0,25,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff5b22';ctx.beginPath();ctx.moveTo(-8,10);ctx.lineTo(-22,23);ctx.lineTo(-16,6);ctx.lineTo(-28,4);ctx.lineTo(-11,-2);ctx.closePath();ctx.fill();ctx.fillStyle='#ffd447';ctx.beginPath();ctx.moveTo(-7,8);ctx.lineTo(-17,17);ctx.lineTo(-11,3);ctx.lineTo(-20,3);ctx.lineTo(-7,0);ctx.closePath();ctx.fill();}ctx.fillStyle='rgba(43,24,54,.2)';ctx.beginPath();ctx.ellipse(0,12,13,5,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff7dc';ctx.strokeStyle='#2b1836';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,12,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#2b1836';ctx.beginPath();ctx.arc(0,0,4,0,Math.PI*2);ctx.fill();for(let i=0;i<4;i++){let t=i*Math.PI/2;ctx.beginPath();ctx.moveTo(Math.cos(t)*4,Math.sin(t)*4);ctx.lineTo(Math.cos(t)*11,Math.sin(t)*11);ctx.stroke();}ctx.restore();}
    function draw(){drawField();drawBall();drawPlayer(player,true,'MARIO');teammates.forEach((a,i)=>drawPlayer(a,true,i===0?'LUIGI':'MATE'));drawPlayer(rival,false,'KOOPA');opponents.forEach((a,i)=>drawPlayer(a,false,i===0?'BOWSER':'GOON'));if(messageTimer>0){ctx.fillStyle='rgba(43,24,54,.78)';rr(W/2-180,H-70,360,44,14);ctx.fillStyle='#fff7dc';ctx.font='900 23px Trebuchet MS';ctx.textAlign='center';ctx.fillText(message,W/2,H-40);}}
    function loop(t){let dt=Math.min(32,t-last);last=t;if(dt>0)update();draw();requestAnimationFrame(loop);}requestAnimationFrame(loop);
  </script>
</body>
</html>
