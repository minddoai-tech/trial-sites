<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Neon Dash</title>
  <style>
    :root {
      --ink: #eef4ff;
      --muted: #9aa8c4;
      --panel: rgba(12, 18, 37, .76);
      --line: rgba(165, 184, 225, .18);
      --cyan: #65e8ff;
      --purple: #a78bfa;
      --danger: #ff668d;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #080b18; }
    body {
      display: grid; place-items: center; overflow: hidden; color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .game-shell { width: min(100vw, 1120px); padding: 18px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 0 2px 12px; }
    .brand { display: flex; align-items: center; gap: 10px; letter-spacing: .13em; font-size: 12px; font-weight: 800; text-transform: uppercase; }
    .brand-mark { width: 10px; height: 10px; background: var(--cyan); transform: rotate(45deg); box-shadow: 0 0 18px var(--cyan); }
    .hint { color: var(--muted); font-size: 12px; }
    .stage { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 18px; background: #0b1125; box-shadow: 0 24px 80px rgba(0, 0, 0, .42); }
    canvas { display: block; width: 100%; height: min(67vh, 600px); min-height: 380px; }
    .hud { position: absolute; top: 18px; left: 18px; display: flex; gap: 10px; pointer-events: none; }
    .metric { min-width: 108px; padding: 10px 13px; border: 1px solid var(--line); border-radius: 11px; background: var(--panel); backdrop-filter: blur(10px); }
    .metric-label { color: var(--muted); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
    .metric-value { margin-top: 3px; font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 800; }
    .metric-value span { color: var(--muted); font-size: 12px; font-weight: 600; }
    .overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; background: rgba(7, 10, 22, .46); backdrop-filter: blur(4px); }
    .overlay.hidden { display: none; }
    .card { width: min(390px, 100%); padding: 28px; border: 1px solid rgba(164, 184, 235, .22); border-radius: 18px; background: rgba(13, 20, 43, .9); box-shadow: 0 24px 70px rgba(0,0,0,.34); text-align: center; }
    .eyebrow { color: var(--cyan); font-size: 10px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 8px 0 8px; font-size: clamp(30px, 6vw, 48px); letter-spacing: -.05em; }
    .card p { margin: 0 auto 20px; max-width: 300px; color: var(--muted); line-height: 1.55; font-size: 14px; }
    .key { display: inline-block; margin: 0 2px; padding: 3px 7px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; color: var(--ink); background: rgba(255,255,255,.06); font-size: 11px; font-weight: 700; }
    button { width: 100%; padding: 12px 16px; border: 0; border-radius: 10px; color: #081020; background: var(--cyan); cursor: pointer; font: inherit; font-size: 14px; font-weight: 850; box-shadow: 0 8px 24px rgba(101,232,255,.22); transition: transform .15s, filter .15s; }
    button:hover { filter: brightness(1.08); transform: translateY(-1px); }
    button:active { transform: translateY(1px); }
    .footer-note { padding-top: 12px; color: var(--muted); text-align: center; font-size: 11px; }
    @media (max-width: 600px) {
      .game-shell { padding: 10px; }
      .topbar { padding-bottom: 8px; }
      .hint { display: none; }
      .hud { top: 10px; left: 10px; gap: 6px; }
      .metric { min-width: 92px; padding: 8px 10px; }
      .metric-value { font-size: 17px; }
      canvas { min-height: 420px; height: 70vh; }
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div class="brand"><i class="brand-mark"></i> Neon Dash</div>
      <div class="hint">SPACE / ↑ to jump</div>
    </header>
    <section class="stage" aria-label="Neon Dash game">
      <canvas id="game" aria-label="Playable jumping game"></canvas>
      <div class="hud">
        <div class="metric"><div class="metric-label">Distance</div><div class="metric-value"><span id="distance">0</span> <span>studs</span></div></div>
        <div class="metric"><div class="metric-label">Best run</div><div class="metric-value"><span id="best">0</span> <span>studs</span></div></div>
      </div>
      <div class="overlay" id="overlay">
        <div class="card">
          <div class="eyebrow" id="overlayEyebrow">Endless run</div>
          <h1 id="overlayTitle">Neon Dash</h1>
          <p id="overlayText">Jump over every spike. The world moves on its own — you only control the jump.</p>
          <button id="startButton">Start run</button>
        </div>
      </div>
    </section>
    <div class="footer-note">One spike = one stud &nbsp;·&nbsp; Three-spike groups are possible</div>
  </main>
  <script>
    (() => {
      'use strict';
      const canvas = document.querySelector('#game');
      const ctx = canvas.getContext('2d');
      const overlay = document.querySelector('#overlay');
      const overlayEyebrow = document.querySelector('#overlayEyebrow');
      const overlayTitle = document.querySelector('#overlayTitle');
      const overlayText = document.querySelector('#overlayText');
      const startButton = document.querySelector('#startButton');
      const distanceEl = document.querySelector('#distance');
      const bestEl = document.querySelector('#best');

      const CONFIG = { speed: 365, gravity: 1940, jump: 655, playerSize: 30, groundRatio: .79, placementTime: 2.5, spikeWidth: 32, spikeHeight: 38, deathDelay: 100 };
      const state = { running: false, dead: false, deathAt: 0, last: 0, distance: 0, worldX: 0, spawnClock: 0, nextPattern: 0, level: 1, mode: 'cube', spawnedSpikeCount: 0, nextPortalAt: 10, best: Number(localStorage.getItem('neon-dash-best') || 0) };
      const player = { x: 160, y: 0, vy: 0, grounded: true, rotation: 0, thrusting: false };
      const spikes = [];
      const portals = [];
      const patterns = [];
      const clouds = Array.from({ length: 12 }, (_, i) => ({ x: i * 260 + 30, y: 45 + (i % 4) * 46, w: 44 + (i % 3) * 24 }));
      bestEl.textContent = state.best;

      // A readable 50-placement seed. Each placement contains no more than 3 contiguous spikes.
      const seed = [1,1,2,1,3,1,2,1,1,3,1,2,1,1,2,3,1,1,2,1,3,1,2,1,1,2,1,3,1,1,2,1,2,3,1,1,2,1,3,1,1,2,1,2,3,1,1,2,1,3];
      seed.forEach((count, index) => patterns.push({ count, index }));

      function resize() {
        const rect = canvas.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(rect.width * dpr); canvas.height = Math.round(rect.height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (!state.running) player.y = groundY() - CONFIG.playerSize;
      }
      function groundY() { return canvas.clientHeight * CONFIG.groundRatio; }
      function addPlacement(offset = 0) {
        const pattern = patterns[state.nextPattern++ % patterns.length];
        const start = canvas.clientWidth + CONFIG.speed * .65 + offset;
        for (let i = 0; i < pattern.count; i++) spikes.push({ x: start + i * CONFIG.spikeWidth, count: pattern.count, counted: false });
        if (state.level === 2) {
          const after = state.spawnedSpikeCount + pattern.count;
          while (state.nextPortalAt <= after) {
            portals.push({ x: start + pattern.count * CONFIG.spikeWidth + 115, type: Math.random() < .5 ? 'ship' : 'spam', activated: false });
            state.nextPortalAt += 10;
          }
        }
        state.spawnedSpikeCount += pattern.count;
      }
      function reset(level = 1) {
        state.level = level; state.running = true; state.dead = false; state.deathAt = 0; state.last = performance.now(); state.distance = 0; state.worldX = 0; state.spawnClock = CONFIG.placementTime - .65; state.nextPattern = 0; state.mode = 'cube'; state.spawnedSpikeCount = 0; state.nextPortalAt = 10;
        spikes.length = 0; portals.length = 0; player.vy = 0; player.grounded = true; player.rotation = 0; player.thrusting = false; player.y = groundY() - CONFIG.playerSize;
        overlay.classList.add('hidden'); distanceEl.textContent = '0';
        for (let i = 0; i < 3; i++) addPlacement(i * CONFIG.speed * CONFIG.placementTime);
        requestAnimationFrame(loop);
      }
      function die() {
        if (state.dead) return;
        state.dead = true; state.deathAt = performance.now();
        state.best = Math.max(state.best, state.distance); localStorage.setItem('neon-dash-best', state.best); bestEl.textContent = state.best;
      }
      function jump() {
        if (!state.running || state.dead) return;
        if (state.mode === 'ship') { player.thrusting = true; return; }
        if (state.mode === 'spam' || player.grounded) { player.vy = -CONFIG.jump * (state.mode === 'spam' ? .76 : 1); player.grounded = false; }
      }
      function completeLevel() {
        state.running = false;
        overlayEyebrow.textContent = state.level === 1 ? 'Level 1 complete' : 'Level 2 complete';
        overlayTitle.textContent = 'You beat the Game!';
        overlayText.textContent = state.level === 1 ? 'The next level adds randomized spaceship and spamming arrow portals.' : 'You cleared both levels. Nice run!';
        startButton.textContent = state.level === 1 ? 'Start Level 2' : 'Play again';
        overlay.classList.remove('hidden');
      }
      function portalHit(portal) {
        return !portal.activated && player.x + CONFIG.playerSize > portal.x && player.x < portal.x + 38 && player.y + CONFIG.playerSize > groundY() - 86;
      }
      function collides(spike) {
        const px = player.x + 5, py = player.y + 5, pw = CONFIG.playerSize - 10, ph = CONFIG.playerSize - 7;
        const sx = spike.x, sy = groundY() - CONFIG.spikeHeight, sw = CONFIG.spikeWidth, sh = CONFIG.spikeHeight;
        // Triangle hitbox is slightly forgiving at the very tip, but catches landing on a spike.
        const near = px < sx + sw && px + pw > sx && py < sy + sh && py + ph > sy + 5;
        return near;
      }
      function update(dt) {
        if (!state.running) return;
        if (!state.dead) {
          state.worldX += CONFIG.speed * dt;
          state.spawnClock += dt;
          if (state.spawnClock >= CONFIG.placementTime) { state.spawnClock -= CONFIG.placementTime; addPlacement(); }
          if (state.mode === 'ship') {
            player.vy += CONFIG.gravity * .48 * dt;
            if (player.thrusting) player.vy -= 2350 * dt;
            player.vy = Math.max(-760, Math.min(760, player.vy));
          } else player.vy += CONFIG.gravity * dt;
          player.y += player.vy * dt;
          const floor = groundY() - CONFIG.playerSize;
          const ceiling = 18;
          if (player.y >= floor) { player.y = floor; player.vy = 0; player.grounded = true; }
          else if (state.mode === 'ship' && player.y <= ceiling) { player.y = ceiling; player.vy = 0; player.grounded = false; }
          else player.grounded = false;
          if (!player.grounded) player.rotation += dt * 6.2;
          spikes.forEach(spike => {
            spike.x -= CONFIG.speed * dt;
            if (!spike.counted && spike.x + CONFIG.spikeWidth < player.x && state.distance < 50) { spike.counted = true; state.distance += 1; }
          });
          portals.forEach(portal => {
            portal.x -= CONFIG.speed * dt;
            if (portalHit(portal)) { portal.activated = true; state.mode = portal.type; player.vy = 0; player.grounded = false; }
          });
          while (spikes.length && spikes[0].x < -CONFIG.spikeWidth * 2) spikes.shift();
          while (portals.length && portals[0].x < -80) portals.shift();
          for (const spike of spikes) if (collides(spike)) { die(); break; }
          if (state.distance >= 50) { completeLevel(); return; }
          distanceEl.textContent = state.distance;
        } else if (performance.now() - state.deathAt >= CONFIG.deathDelay) {
          state.running = false;
          overlayEyebrow.textContent = 'Run over'; overlayTitle.textContent = state.distance + ' studs'; overlayText.textContent = 'You clipped a spike. Ready to try a longer run?'; startButton.textContent = 'Restart run'; overlay.classList.remove('hidden');
        }
      }
      function draw() {
        const w = canvas.clientWidth, h = canvas.clientHeight, ground = groundY();
        const gradient = ctx.createLinearGradient(0, 0, 0, h); gradient.addColorStop(0, '#101b3d'); gradient.addColorStop(1, '#080c1e'); ctx.fillStyle = gradient; ctx.fillRect(0, 0, w, h);
        ctx.globalAlpha = .2; ctx.fillStyle = '#899bff';
        clouds.forEach(cloud => { const x = ((cloud.x - state.worldX * .12) % (w + 180) + w + 180) % (w + 180) - 90; ctx.beginPath(); ctx.ellipse(x, cloud.y, cloud.w, 6, 0, 0, Math.PI * 2); ctx.fill(); }); ctx.globalAlpha = 1;
        ctx.fillStyle = '#111d3a'; ctx.fillRect(0, ground, w, h - ground);
        ctx.strokeStyle = 'rgba(101,232,255,.22)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, ground + .5); ctx.lineTo(w, ground + .5); ctx.stroke();
        ctx.strokeStyle = 'rgba(153,169,215,.1)'; for (let x = -((state.worldX * .55) % 52); x < w; x += 52) { ctx.beginPath(); ctx.moveTo(x, ground + 20); ctx.lineTo(x + 18, ground + 20); ctx.stroke(); }
        portals.forEach(portal => {
          if (portal.x > w + 60 || portal.x < -70) return;
          const color = portal.type === 'ship' ? '#a78bfa' : '#65e8ff';
          ctx.save(); ctx.translate(portal.x + 19, ground - 43); ctx.strokeStyle = color; ctx.lineWidth = 4; ctx.shadowColor = color; ctx.shadowBlur = 18; ctx.beginPath(); ctx.ellipse(0, 0, 19, 40, 0, 0, Math.PI * 2); ctx.stroke(); ctx.shadowBlur = 0; ctx.fillStyle = color; ctx.font = '800 12px system-ui'; ctx.textAlign = 'center'; ctx.fillText(portal.type === 'ship' ? '✦' : '↑↑', 0, 4); ctx.restore();
        });
        spikes.forEach(spike => { if (spike.x > w + 20 || spike.x < -50) return; const y = ground - CONFIG.spikeHeight; const g = ctx.createLinearGradient(spike.x, y, spike.x, ground); g.addColorStop(0, '#ff91aa'); g.addColorStop(1, '#df3f74'); ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(spike.x, ground); ctx.lineTo(spike.x + CONFIG.spikeWidth / 2, y); ctx.lineTo(spike.x + CONFIG.spikeWidth, ground); ctx.closePath(); ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,.32)'; ctx.stroke(); });
        ctx.save(); ctx.translate(player.x + CONFIG.playerSize / 2, player.y + CONFIG.playerSize / 2); ctx.rotate(state.mode === 'ship' ? Math.max(-.45, Math.min(.45, player.vy / 900)) : player.rotation); ctx.shadowColor = state.mode === 'ship' ? '#a78bfa' : '#65e8ff'; ctx.shadowBlur = 18; ctx.fillStyle = state.mode === 'ship' ? '#a78bfa' : '#65e8ff';
        if (state.mode === 'ship') { ctx.beginPath(); ctx.moveTo(18, 0); ctx.lineTo(-14, -11); ctx.lineTo(-8, 0); ctx.lineTo(-14, 11); ctx.closePath(); ctx.fill(); } else { ctx.fillRect(-CONFIG.playerSize / 2, -CONFIG.playerSize / 2, CONFIG.playerSize, CONFIG.playerSize); ctx.shadowBlur = 0; ctx.fillStyle = '#122242'; ctx.fillRect(-7, -7, 5, 5); ctx.fillRect(2, -7, 5, 5); }
        ctx.restore();
        if (state.dead && performance.now() - state.deathAt < CONFIG.deathDelay) { ctx.fillStyle = 'rgba(255, 65, 108, .15)'; ctx.fillRect(0, 0, w, h); }
      }
      function loop(now) { const dt = Math.min((now - state.last) / 1000, .034); state.last = now; update(dt); draw(); if (state.running) requestAnimationFrame(loop); }
      window.addEventListener('resize', resize);
      function startFromOverlay() { if (overlayTitle.textContent === 'You beat the Game!') reset(state.level === 1 ? 2 : 1); else reset(state.level); }
      window.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); if (!state.running) startFromOverlay(); else jump(); } });
      window.addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'ArrowUp') player.thrusting = false; });
      canvas.addEventListener('pointerdown', jump);
      startButton.addEventListener('click', startFromOverlay);
      resize(); draw();
    })();
  </script>
</body>
</html>
