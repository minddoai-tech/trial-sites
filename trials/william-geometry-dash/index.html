<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10121d">
<title>Neon Run — a tiny platform game</title>
<style>
  :root { color-scheme: dark; --ink:#f6f4ff; --muted:#9da0b7; --panel:#171a29; --line:#2b3044; --mint:#79f7ca; --violet:#9c8cff; --pink:#ff6a9d; }
  * { box-sizing:border-box }
  html, body { margin:0; min-height:100%; background:#0d0f18; color:var(--ink); font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,"Segoe UI",sans-serif }
  body { min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(ellipse at 50% -12%,#252441 0,transparent 56%),#0d0f18 }
  button { color:inherit; font:inherit }
  .shell { width:min(1040px,100%); }
  .topline { display:flex; align-items:center; justify-content:space-between; gap:20px; margin:0 2px 16px; }
  .brand { display:flex; align-items:center; gap:12px; font-size:14px; font-weight:750; letter-spacing:.16em; text-transform:uppercase; }
  .brand-mark { display:grid; place-items:center; width:32px; height:32px; border:1px solid #80f5d1; color:#80f5d1; border-radius:9px; transform:rotate(-8deg); font-size:17px; box-shadow:0 0 24px #79f7ca22 }
  .topnote { color:var(--muted); font-size:13px }
  .game-frame { position:relative; overflow:hidden; border:1px solid #34384f; border-radius:18px; background:#131626; box-shadow:0 28px 90px #0008,0 0 0 5px #ffffff03; }
  .hud { position:absolute; z-index:2; inset:18px 20px auto; display:flex; align-items:flex-start; justify-content:space-between; pointer-events:none }
  .hud-block { min-width:98px }
  .hud-label { color:#8e93ab; font-size:10px; font-weight:750; letter-spacing:.16em; text-transform:uppercase }
  .hud-value { margin-top:3px; font-size:17px; font-weight:760; letter-spacing:.02em }
  .hud-right { text-align:right }
  .meter { position:absolute; z-index:2; top:0; left:0; right:0; height:3px; background:#ffffff0a }
  .meter-fill { height:100%; width:0; background:linear-gradient(90deg,var(--mint),#a895ff); box-shadow:0 0 14px #79f7ca99; transition:width .1s linear }
  canvas { display:block; width:100%; aspect-ratio: 16 / 7; min-height:260px; max-height:510px; }
  .overlay { position:absolute; z-index:3; inset:0; display:grid; place-items:center; padding:24px; background:linear-gradient(90deg,#0d0f18bf,#0d0f1888,#0d0f18bf); backdrop-filter:blur(5px); transition:opacity .2s ease,visibility .2s ease }
  .overlay.hidden { opacity:0; visibility:hidden; pointer-events:none }
  .card { width:min(470px,100%); padding:30px 32px 28px; border:1px solid #34384f; border-radius:16px; background:#151827ed; box-shadow:0 20px 60px #0007; text-align:center }
  .eyebrow { color:var(--mint); font-size:11px; font-weight:800; letter-spacing:.2em; text-transform:uppercase }
  h1 { margin:10px 0 8px; font-size:clamp(30px,5vw,44px); line-height:1.02; letter-spacing:-.045em }
  .copy { margin:0 auto; max-width:350px; color:#b4b7c8; font-size:15px; line-height:1.6 }
  .keycap { display:inline-grid; place-items:center; min-width:46px; height:28px; margin:0 4px; padding:0 9px; border:1px solid #585c75; border-bottom-width:3px; border-radius:6px; color:#f4f3ff; font-size:12px; font-weight:750; letter-spacing:.04em }
  .primary { display:block; width:100%; margin-top:22px; padding:13px 18px; border:0; border-radius:9px; color:#10151c; background:var(--mint); font-weight:800; cursor:pointer; box-shadow:0 5px 20px #79f7ca22; transition:transform .15s,filter .15s }
  .primary:hover { transform:translateY(-2px); filter:brightness(1.06) }
  .primary:focus-visible,.secondary:focus-visible { outline:3px solid white; outline-offset:3px }
  .secondary { margin-top:12px; padding:7px 10px; border:0; background:transparent; color:#b5b7c8; font-size:13px; cursor:pointer; text-decoration:underline; text-decoration-color:#ffffff40; text-underline-offset:3px }
  .secondary:hover { color:white }
  .level-row { display:flex; gap:8px; justify-content:center; margin:19px 0 0 }
  .pip { width:8px; height:8px; border-radius:50%; background:#363b50 }
  .pip.active { background:var(--mint); box-shadow:0 0 10px #79f7ca99 }
  .controls { display:flex; justify-content:space-between; gap:16px; align-items:center; margin:14px 4px 0; color:#8e93ab; font-size:13px }
  .controls strong { color:#d9dbea; font-weight:650 }
  .control-key { display:inline-grid; place-items:center; margin-right:8px; padding:3px 8px; border:1px solid #353a4d; border-radius:5px; color:#dfe2ef; font-size:11px; font-weight:750 }
  @media(max-width:600px) { body{padding:14px}.topnote{display:none}.game-frame{border-radius:13px}.hud{inset:14px 14px auto}.hud-label{font-size:9px}.hud-value{font-size:15px}.card{padding:26px 20px}.controls{font-size:12px}canvas{min-height:300px;aspect-ratio:4/3} }
  @media(prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none!important } }
</style>
</head>
<body>
<main class="shell">
  <header class="topline"><div class="brand"><span class="brand-mark">◇</span> Neon Run</div><div class="topnote">3 levels · 5 runner shapes</div></header>
  <section class="game-frame" aria-label="Neon Run game">
    <div class="meter"><div class="meter-fill" id="meterFill"></div></div>
    <div class="hud" aria-live="polite">
      <div class="hud-block"><div class="hud-label">Level</div><div class="hud-value" id="levelReadout">01 / 03</div></div>
      <div class="hud-block hud-right"><div class="hud-label">Run</div><div class="hud-value" id="statusReadout">READY</div></div>
    </div>
    <canvas id="game" aria-label="Jump over the glowing obstacles to finish the level"></canvas>
    <div class="overlay" id="overlay">
      <div class="card">
        <div class="eyebrow" id="eyebrow">One button. Three levels.</div>
        <h1 id="title">Find your rhythm.</h1>
        <p class="copy" id="copy">Your little runner moves on its own. Clear every obstacle, keep your timing, and make it to the end.</p>
        <div class="level-row" aria-label="Three levels"><span class="pip active"></span><span class="pip"></span><span class="pip"></span></div>
        <button class="primary" id="startButton">Play level 1</button>
        <button class="secondary" id="restartButton" hidden>Restart this level</button>
      </div>
    </div>
  </section>
  <footer class="controls"><span><span class="control-key">SPACE</span><strong>Jump</strong> · tap again after landing</span><span>Hit an obstacle? Your level starts over.</span></footer>
</main>
<script>
(() => {
  const canvas = document.querySelector('#game');
  const ctx = canvas.getContext('2d');
  const overlay = document.querySelector('#overlay');
  const title = document.querySelector('#title');
  const eyebrow = document.querySelector('#eyebrow');
  const copy = document.querySelector('#copy');
  const startButton = document.querySelector('#startButton');
  const restartButton = document.querySelector('#restartButton');
  const levelReadout = document.querySelector('#levelReadout');
  const statusReadout = document.querySelector('#statusReadout');
  const meterFill = document.querySelector('#meterFill');
  const pips = [...document.querySelectorAll('.pip')];
  const TOTAL = 3;
  const player = { x: 125, y: 0, size: 30, vy: 0, grounded: true, rotation: 0, shape: 'square' };
  const shapes = ['square','diamond','orb','hexagon','triangle'];
  let shapeTurn = -1;
  const levels = [
    { name:'Warm up', length:2600, speed:230, palette:['#79f7ca','#ff6a9d','#a18dff'], hazards:[{x:530,type:'spike'},{x:940,type:'double'},{x:1450,type:'block'},{x:1910,type:'saw'},{x:2340,type:'spike'}] },
    { name:'Quickstep', length:3150, speed:275, palette:['#a18dff','#ffb36b','#79f7ca'], hazards:[{x:470,type:'double'},{x:890,type:'saw'},{x:1310,type:'block'},{x:1740,type:'spike'},{x:2160,type:'double'},{x:2600,type:'pillar'},{x:2910,type:'spike'}] },
    { name:'Full tilt', length:3650, speed:315, palette:['#ffb36b','#ff6a9d','#a18dff'], hazards:[{x:430,type:'spike'},{x:800,type:'block'},{x:1170,type:'double'},{x:1540,type:'saw'},{x:1910,type:'pillar'},{x:2280,type:'double'},{x:2650,type:'block'},{x:3020,type:'saw'},{x:3390,type:'spike'}] }
  ];
  let w=0,h=0,dpr=1,ground=0,level=0,progress=0,speed=0,state='ready',lastTime=0,particles=[],shake=0;
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  function resize(){
    const rect=canvas.getBoundingClientRect(); dpr=Math.min(window.devicePixelRatio||1,2);
    w=rect.width; h=rect.height; canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0); ground=h*.77;
    if(player.grounded) player.y=ground-player.size;
    draw();
  }
  function setLevelUI(){
    levelReadout.textContent=`${String(level+1).padStart(2,'0')} / 0${TOTAL}`;
    pips.forEach((pip,i)=>pip.classList.toggle('active',i===level));
    meterFill.style.width='0%';
  }
  function showOverlay(mode){
    overlay.classList.remove('hidden'); restartButton.hidden=mode==='ready';
    if(mode==='ready'){
      eyebrow.textContent='One button. Three levels.'; title.textContent='Find your rhythm.';
      copy.innerHTML='Your little runner moves on its own. Clear every obstacle, keep your timing, and make it to the end.';
      startButton.textContent=`Play level ${level+1}`;
    } else if(mode==='crash'){
      eyebrow.textContent='Oof. Reset the beat.'; title.textContent='Back to the start.';
      copy.textContent=`You hit an obstacle. Level ${level+1} is ready when you are.`;
      startButton.textContent='Try again';
    } else if(mode==='level'){
      eyebrow.textContent='Clean landing.'; title.textContent=`Level ${level+1} cleared!`;
      copy.textContent=level<TOTAL-1?'The pace picks up from here. Ready for the next one?':'You cleared all three levels. Beautiful timing.';
      startButton.textContent=level<TOTAL-1?`Play level ${level+1}`:'Play again';
    }
  }
  function begin(){
    if(state==='won' && level===TOTAL-1) level=0;
    shapeTurn=(shapeTurn+1)%shapes.length; player.shape=shapes[shapeTurn];
    progress=0; speed=levels[level].speed*.72; player.vy=0; player.grounded=true; player.rotation=0; player.y=ground-player.size;
    particles=[]; shake=0; state='playing'; statusReadout.textContent='RUNNING'; setLevelUI(); overlay.classList.add('hidden'); lastTime=performance.now(); requestAnimationFrame(loop);
  }
  function jump(){
    if(state!=='playing') return;
    if(player.grounded){player.vy=-h*.88;player.grounded=false;burst(player.x+player.size/2,player.y+player.size,7,'#79f7ca');}
  }
  function fail(){ state='crash'; statusReadout.textContent='RETRY'; shake=12; burst(player.x+player.size/2,player.y+player.size/2,22,'#ff6a9d'); showOverlay('crash'); }
  function complete(){
    if(level<TOTAL-1){level++;state='ready';statusReadout.textContent='CLEAR';setLevelUI();showOverlay('level');}
    else {state='won';statusReadout.textContent='CLEAR';meterFill.style.width='100%';showOverlay('level');}
  }
  function burst(x,y,n,color){ for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*210,vy:(Math.random()-.8)*190,life:.35+Math.random()*.45,color,size:2+Math.random()*3}); }
  function hazardBox(hazard){return ({spike:{w:28,h:38},double:{w:54,h:38},block:{w:34,h:36},saw:{w:42,h:42},pillar:{w:34,h:52}})[hazard.type];}
  function update(dt){
    const cfg=levels[level]; speed=Math.min(cfg.speed*1.5,speed+dt*4.2); progress+=speed*dt;
    player.vy+=h*2.8*dt; player.y+=player.vy*dt;
    if(player.y>=ground-player.size){player.y=ground-player.size;player.vy=0;player.grounded=true;player.rotation=0;}
    else player.rotation+=dt*4.2;
    for(const hazard of cfg.hazards){
      const x=player.x+(hazard.x-progress), box=hazardBox(hazard);
      if(x+box.w>player.x+4&&x<player.x+player.size-4&&player.y+player.size>ground-box.h+7){fail();return;}
    }
    meterFill.style.width=`${clamp(progress/cfg.length*100,0,100)}%`;
    if(progress>=cfg.length)complete();
    particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=h*.5*dt;p.life-=dt;});particles=particles.filter(p=>p.life>0);
  }
  function draw(){
    if(!ctx||!w||!h)return;
    ctx.save(); if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake=Math.max(0,shake-1.2);}
    const palette=levels[level].palette, bg=ctx.createLinearGradient(0,0,0,h); bg.addColorStop(0,'#191a2c');bg.addColorStop(.56,'#171a29');bg.addColorStop(1,'#111421');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
    const glow=ctx.createRadialGradient(w*.72,h*.33,5,w*.72,h*.33,w*.58);glow.addColorStop(0,palette[0]+'28');glow.addColorStop(1,palette[0]+'00');ctx.fillStyle=glow;ctx.fillRect(0,0,w,h);
    // soft stars
    for(let i=0;i<42;i++){const x=(i*167.3-(state==='playing'?progress*.08:0))%w;const y=30+(i*79.7%(ground-60));ctx.fillStyle=i%5===0?'#c0bbff55':'#c8c9e622';ctx.fillRect((x+w)%w,y,i%5===0?2:1,i%5===0?2:1);}
    // parallax ridge line and city silhouettes add depth behind the course
    const parallax=state==='playing'?progress:0;
    ctx.fillStyle='#22243a';ctx.beginPath();ctx.moveTo(0,ground-34);
    for(let i=0;i<=8;i++){const x=i*w/8;ctx.lineTo(x,ground-34-(i%2?23:0)-Math.sin(i*1.4)*12);}
    ctx.lineTo(w,ground);ctx.lineTo(0,ground);ctx.closePath();ctx.fill();
    const cityShift=(parallax*.16)%96;
    for(let i=-1;i<Math.ceil(w/96)+2;i++){
      const x=i*96-cityShift, bh=42+((i*37%47)+47)%47;
      ctx.fillStyle=i%2?'#252840':'#292b45';ctx.fillRect(x,ground-bh,62,bh);
      ctx.fillStyle=palette[2]+'55';
      for(let wy=ground-bh+12;wy<ground-10;wy+=16)for(let wx=x+10;wx<x+55;wx+=17)if((Math.floor(wx)+Math.floor(wy)+i)%3!==0)ctx.fillRect(wx,wy,4,6);
    }
    // layered foreground floor with moving lane lights
    ctx.fillStyle='#171a29';ctx.fillRect(0,ground,w,h-ground);ctx.fillStyle='#20243a';ctx.fillRect(0,ground+7,w,8);
    ctx.shadowColor=palette[0];ctx.shadowBlur=10;ctx.strokeStyle=palette[0]+'aa';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,ground+.5);ctx.lineTo(w,ground+.5);ctx.stroke();ctx.shadowBlur=0;
    const shift=(parallax*.72)%48;ctx.strokeStyle='#343950';ctx.lineWidth=1;
    for(let x=-shift;x<w;x+=48){ctx.beginPath();ctx.moveTo(x,ground+15);ctx.lineTo(x-18,ground+45);ctx.stroke();ctx.fillStyle=palette[0]+'77';ctx.fillRect(x-2,ground+17,6,2);}
    // distinct obstacle profiles; every one is cleared with a timed jump
    for(const hazard of levels[level].hazards){
      const x=player.x+(hazard.x-progress), b=hazardBox(hazard), y=ground-b.h;if(x < -70||x>w+70)continue;
      ctx.save();ctx.shadowColor=palette[1];ctx.shadowBlur=18;ctx.fillStyle=palette[1];ctx.strokeStyle='#ffe1ed';ctx.lineWidth=1.5;
      if(hazard.type==='spike'||hazard.type==='double'){
        const count=hazard.type==='double'?2:1;
        for(let i=0;i<count;i++){const sx=x+i*27;ctx.beginPath();ctx.moveTo(sx,y+b.h);ctx.lineTo(sx+14,y);ctx.lineTo(sx+28,y+b.h);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.beginPath();ctx.moveTo(sx+10,y+b.h-4);ctx.lineTo(sx+14,y+11);ctx.lineTo(sx+18,y+b.h-4);ctx.stroke();ctx.shadowBlur=18;}
      } else if(hazard.type==='saw'){
        const cx=x+b.w/2,cy=ground-b.h/2;ctx.translate(cx,cy);ctx.rotate(parallax*.015);ctx.beginPath();
        for(let i=0;i<24;i++){const a=i*Math.PI/12,r=i%2?15:21;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#25263a';ctx.beginPath();ctx.arc(0,0,7,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ffd6e4';ctx.beginPath();ctx.arc(0,0,12,0,Math.PI*2);ctx.stroke();
      } else {
        ctx.beginPath();ctx.moveTo(x+5,ground);ctx.lineTo(x+5,y+7);ctx.lineTo(x+12,y);ctx.lineTo(x+b.w-12,y);ctx.lineTo(x+b.w-5,y+7);ctx.lineTo(x+b.w-5,ground);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#ffffff77';ctx.beginPath();ctx.moveTo(x+13,y+9);ctx.lineTo(x+13,ground-4);ctx.moveTo(x+b.w-13,y+9);ctx.lineTo(x+b.w-13,ground-4);ctx.stroke();
      }
      ctx.restore();
    }
    // the runner keeps its face as its silhouette changes from run to run
    ctx.save();ctx.translate(player.x+player.size/2,player.y+player.size/2);ctx.rotate(player.rotation);
    const s=player.size, accent=palette[0];ctx.shadowColor=accent;ctx.shadowBlur=22;ctx.fillStyle=accent;ctx.beginPath();
    if(player.shape==='square')ctx.roundRect(-s/2,-s/2,s,s,5);
    else if(player.shape==='diamond'){ctx.moveTo(0,-s*.62);ctx.lineTo(s*.58,0);ctx.lineTo(0,s*.62);ctx.lineTo(-s*.58,0);ctx.closePath();}
    else if(player.shape==='orb')ctx.ellipse(0,0,s*.53,s*.53,0,0,Math.PI*2);
    else if(player.shape==='hexagon'){for(let i=0;i<6;i++){const a=i*Math.PI/3-Math.PI/6;ctx.lineTo(Math.cos(a)*s*.58,Math.sin(a)*s*.58);}ctx.closePath();}
    else {ctx.moveTo(0,-s*.62);ctx.lineTo(s*.58,s*.48);ctx.lineTo(-s*.58,s*.48);ctx.closePath();}
    ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#16202a';ctx.fillRect(-7,-5,4,4);ctx.fillRect(3,-5,4,4);ctx.fillRect(-5,4,10,2);ctx.restore();
    // particles
    particles.forEach(p=>{ctx.globalAlpha=clamp(p.life*1.7,0,1);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.size,p.size);});ctx.globalAlpha=1;
    ctx.restore();
  }
  function loop(now){if(state!=='playing')return;const dt=Math.min((now-lastTime)/1000,.035);lastTime=now;update(dt);draw();if(state==='playing')requestAnimationFrame(loop);else draw();}
  startButton.addEventListener('click',begin);restartButton.addEventListener('click',begin);
  window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(state==='playing')jump();else begin();}});
  window.addEventListener('resize',resize);
  setLevelUI();resize();
})();
</script>
</body>
</html>
